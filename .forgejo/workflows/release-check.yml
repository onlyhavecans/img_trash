---
name: Release Check

on:
  push:
    paths:
      - .forgejo/workflows/release.yml
      - .forgejo/workflows/release-check.yml
      - .goreleaser.yaml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-rust@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: https://github.com/mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: GoReleaser Check
        uses: actions/goreleaser@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.1 # renovate: datasource=github-releases depName=goreleaser/goreleaser
          args: release --snapshot --clean
        env:
          GORELEASER_FORCE_TOKEN: gitea
          GITEA_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
